[package]
name = "paintball-serveur"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
rsa = { version = "0.9", default-features = false, features = ["std", "sha2"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = { version = "0.9", features = ["d1"] }
getrandom = { version = "0.2", features = ["js"] }
urlencoding = "2"

[dev-dependencies]
rand = "0.8"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

[profile.dev.package."*"]
opt-level = 3
