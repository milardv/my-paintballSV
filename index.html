<!DOCTYPE html><html lang="fr"><meta charset="utf-8"><link rel="icon" type="image/png" sizes="32x32" href="icone-32.png"><link rel="icon" type="image/png" sizes="192x192" href="icone-192.png"><link rel="apple-touch-icon" href="icone-180.png"><meta name="theme-color" content="#10251f"><meta name="description" content="Paintball solo dans le domaine du Château Saint-Victor, Marseille. 90 secondes, huit cibles, une couleur."><meta property="og:title" content="Saint-Victor · Paintball"><meta property="og:description" content="Paintball solo dans le domaine du Château Saint-Victor, Marseille."><meta property="og:image" content="icone-512.png"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><title>Saint-Victor · Paintball</title>
<style>*{box-sizing:border-box}body{margin:0;background:#10251f;color:#f4f0e7;font:16px system-ui}html,body{overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}canvas{display:block;width:100vw;height:100vh;height:100dvh;outline:none;touch-action:none}#tourner{display:none;position:fixed;inset:0;z-index:5;background:#10251f;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:20px}@media (orientation:portrait) and (pointer:coarse){#tourner{display:flex}}#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#10251f;gap:20px}h1{font:clamp(40px,7vw,96px) Georgia;margin:0}progress{width:min(400px,75vw);accent-color:#40cee4}#error{max-width:700px;white-space:pre-wrap;color:#ff9c97}small{opacity:.75}button{font:inherit;padding:12px 20px;border:1px solid #f4f0e7;background:transparent;color:inherit;cursor:pointer}</style>
<canvas id="unity-canvas" width="960" height="600" tabindex="0" aria-label="Jeu de paintball au Château Saint-Victor"></canvas>
<div id="tourner">Tournez votre téléphone en paysage pour jouer.</div><div id="loading"><img src="icone-192.png" width="96" height="96" alt="" style="border-radius:22px"><small>MARSEILLE · PAINTBALL SOLO</small><h1>Saint-Victor</h1><progress id="progress" max="1" value="0"></progress><span id="status">Préparation du domaine…</span><small>Clavier et souris · ZQSD / WASD · V : changer de vue · ou écran tactile</small><div id="error" role="alert"></div></div>
<script src="Build/publication.loader.js"></script><script>
const canvas=document.getElementById('unity-canvas');
const config={dataUrl:'Build/publication.data.unityweb',frameworkUrl:'Build/publication.framework.js.unityweb',codeUrl:'Build/publication.wasm.unityweb',streamingAssetsUrl:'StreamingAssets',companyName:'Saint-Victor',productName:'Saint-Victor Paintball',productVersion:'0.1',matchWebGLToCanvasSize:true,devicePixelRatio:Math.min(devicePixelRatio,matchMedia('(pointer:coarse)').matches?1:1.5),showBanner:(m,t)=>{console[t==='error'?'error':'warn'](m);if(t==='error')document.getElementById('error').textContent=m}};
createUnityInstance(canvas,config,p=>{document.getElementById('progress').value=p;document.getElementById('status').textContent='Chargement du domaine · '+Math.round(p*100)+' %'}).then(instance=>{window.unityInstance=instance;window.paintballRead=()=>instance.SendMessage('Explorateur','LireEtat','');document.getElementById('loading').style.display='none';canvas.focus()}).catch(e=>{document.getElementById('error').textContent='Le jeu n’a pas pu démarrer : '+e});
document.addEventListener('pointerlockchange',()=>{if(!document.pointerLockElement&&window.paintballState?.active) canvas.focus()});
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
</script></html>
